<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Well-Voicer | Professional Studio</title>
    <style>
        :root { --primary: #d4af37; --bg: #0f0f11; --card: #1a1a1e; --text: #e0e0e0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .container {
            width: 100%; max-width: 450px; background: var(--card);
            padding: 30px; border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h2 { text-align: center; margin: 0 0 5px 0; font-size: 28px; color: var(--primary); letter-spacing: 1px; }
        p.tagline { text-align: center; font-size: 13px; color: #888; margin-bottom: 25px; letter-spacing: 0.5px; }
        
        .quota-container {
            background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px;
            display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 20px;
        }
        .quota-text { color: #aaa; }
        .quota-value { color: var(--primary); font-weight: bold; }

        textarea {
            width: 100%; height: 160px; background: rgba(0,0,0,0.2); color: #fff;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 15px; font-size: 15px; box-sizing: border-box; margin-bottom: 15px;
            resize: none; line-height: 1.6; transition: border 0.3s;
        }
        textarea:focus { outline: none; border-color: var(--primary); }

        select, button { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: none; font-size: 16px; }
        select { background: rgba(0,0,0,0.2); color: var(--primary); border: 1px solid rgba(255,255,255,0.1); appearance: none; }
        
        button {
            background: linear-gradient(135deg, #d4af37 0%, #aa8000 100%);
            color: #000; font-weight: bold; cursor: pointer; transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.98); opacity: 0.9; }

        .progress-container { display: none; width: 100%; margin-bottom: 15px; }
        .progress-bar-bg { width: 100%; background: #333; border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 5px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
        .progress-text { text-align: right; font-size: 12px; color: var(--primary); }

        audio { width: 100%; margin-top: 10px; display: none; border-radius: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Well-Voicer</h2>
    <p class="tagline">Ye, It's Really A Well Voicer!</p>
    
    <div class="quota-container">
        <span class="quota-text">Daily Free Quota:</span>
        <span class="quota-value" id="quotaDisplay">15 Left</span>
    </div>

    <textarea id="textInput" placeholder="Enter your epic Bangla or Arabic story here..."></textarea>
    
    <select id="voiceSelect">
        <option value="Autonoe">Female Storyteller (Autonoe)</option>
        <option value="Zubenelgenubi">Male Storyteller (Zubenelgenubi)</option>
        <option value="DUAL">Dual Voice Acting (Auto-Detect Dialogue)</option>
    </select>
    
    <button id="generateBtn" onclick="generateVoice()">Generate Audio</button>
    
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>
    
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    // Quota System (Local Storage)
    const MAX_QUOTA = 15;
    let currentQuota = localStorage.getItem('wellVoicerQuota');
    let lastDate = localStorage.getItem('wellVoicerDate');
    let today = new Date().toDateString();

    if (lastDate !== today) { currentQuota = MAX_QUOTA; localStorage.setItem('wellVoicerDate', today); }
    else { currentQuota = currentQuota !== null ? parseInt(currentQuota) : MAX_QUOTA; }
    
    function updateQuotaDisplay() {
        document.getElementById('quotaDisplay').innerText = `${currentQuota} Left`;
        localStorage.setItem('wellVoicerQuota', currentQuota);
    }
    updateQuotaDisplay();

    // Loading Bar Logic
    let progressInterval;
    function startProgress() {
        document.getElementById('progressContainer').style.display = 'block';
        document.getElementById('generateBtn').disabled = true;
        document.getElementById('audioPlayer').style.display = 'none';
        let p = 0;
        progressInterval = setInterval(() => {
            if (p < 85) { p += Math.random() * 15; }
            document.getElementById('progressFill').style.width = Math.floor(p) + '%';
            document.getElementById('progressText').innerText = Math.floor(p) + '%';
        }, 500);
    }

    function completeProgress() {
        clearInterval(progressInterval);
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('progressText').innerText = '100%';
        setTimeout(() => { document.getElementById('progressContainer').style.display = 'none'; }, 1000);
        document.getElementById('generateBtn').disabled = false;
    }

    // Audio Generation
    async function generateVoice() {
        const text = document.getElementById('textInput').value;
        const voice = document.getElementById('voiceSelect').value;
        const audioPlayer = document.getElementById('audioPlayer');

        if (!text) return alert("Please enter a story!");
        if (currentQuota <= 0) return alert("Daily quota reached! Please wait until tomorrow.");

        startProgress();

        try {
            const response = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, voice })
            });

            const data = await response.json();
            completeProgress();
            
            if (data.error) {
                alert("API Error: " + data.error);
            } else {
                currentQuota--;
                updateQuotaDisplay();
                // Dynamically injecting the MIME type ensures it plays perfectly
                audioPlayer.src = "data:" + data.mimeType + ";base64," + data.audioContent;
                audioPlayer.style.display = 'block';
                audioPlayer.play();
            }
        } catch (err) {
            completeProgress();
            alert("Network Error!");
        }
    }
</script>

</body>
</html>
