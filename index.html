<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Well-Voicer | Epic Tales</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #0a0a0a;
            color: #d4af37;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #d4af37;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }
        h2 { text-align: center; margin-top: 0; font-size: 26px; }
        p.tagline { text-align: center; font-style: italic; font-size: 14px; margin-bottom: 20px; color: #aaaaaa; }
        textarea {
            width: 100%;
            height: 180px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
            resize: none;
            line-height: 1.5;
        }
        select, button {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        select { background: #222; color: #d4af37; border: 1px solid #555; }
        button {
            background: linear-gradient(to right, #d4af37, #aa8000);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        audio { width: 100%; margin-top: 15px; display: none; }
        .loading { text-align: center; display: none; font-style: italic; margin-top: 10px; color: #d4af37; }
    </style>
</head>
<body>

<div class="container">
    <h2>Well-Voicer</h2>
    <p class="tagline">"Ye, It's Really A Well Voicer!"<br><span style="font-size: 12px;">(Epic Storytelling Edition)</span></p>
    
    <textarea id="textInput" placeholder="এখানে ঐতিহাসিক বা মহাকাব্যিক গল্প লিখুন... (Enter your story here)"></textarea>
    
    <select id="voiceSelect">
        <option value="Autonoe">Female Voice (Autonoe)</option>
        <option value="Zubenelgenubi">Male Voice (Zubenelgenubi)</option>
    </select>
    
    <button onclick="generateVoice()">Tell The Story</button>
    <div id="loadingMessage" class="loading">Breathing life into the story... please wait.</div>
    
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    async function generateVoice() {
        const text = document.getElementById('textInput').value;
        const voice = document.getElementById('voiceSelect').value;
        const audioPlayer = document.getElementById('audioPlayer');
        const loading = document.getElementById('loadingMessage');

        if (!text) return alert("Please enter a story!");

        loading.style.display = 'block';
        audioPlayer.style.display = 'none';

        try {
            const response = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, voice })
            });

            const data = await response.json();
            
            if (data.error) {
                alert("API Error: " + data.error);
            } else {
                audioPlayer.src = "data:" + data.mimeType + ";base64," + data.audioContent;
                audioPlayer.style.display = 'block';
                audioPlayer.play();
            }
        } catch (err) {
            alert("Network Error! Check console.");
        } finally {
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
